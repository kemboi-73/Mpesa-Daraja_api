<!-- templates/stk_form.html -->
<!DOCTYPE html>
<html>
<head>
  <title>STK Push Payment</title>
  <script>
    function initiatePayment(event) {
      event.preventDefault();

      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;

      document.getElementById("status").innerText = "Initiating payment...";

      fetch("/stk/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ phone, amount })
      })
      .then(response => response.json())
      .then(data => {
        if (data.CheckoutRequestID) {
          document.getElementById("status").innerText = "Payment initiated. Verifying...";

          // Delay then query status
          setTimeout(() => {
            fetch("/results/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ CheckoutRequestID: data.CheckoutRequestID })
            })
            .then(res => res.json())
            .then(query => {
              document.getElementById("status").innerText = query.message || JSON.stringify(query);
            });
          }, 10000); // Wait 10 seconds before querying
        } else {
          document.getElementById("status").innerText = data.error || "Error during payment.";
        }
      })
      .catch(err => {
        document.getElementById("status").innerText = "Network error: " + err;
      });
    }
  </script>
</head>
<body>
  <h2>STK Push Payment</h2>
  <form onsubmit="initiatePayment(event)">
    <label for="phone">Phone Number (e.g. 2547xxxxxxx):</label><br>
    <input type="text" id="phone" name="phone" required><br><br>

    <label for="amount">Amount:</label><br>
    <input type="number" id="amount" name="amount" required><br><br>

    <input type="submit" value="Pay Now">
  </form>

  <div id="status" style="margin-top: 20px; font-weight: bold;"></div>
</body>
</html>
