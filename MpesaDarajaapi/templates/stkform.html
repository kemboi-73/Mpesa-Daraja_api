{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MPESA STK Push Payment</title>
  <style>
    /* ... (same styling as yours) ... */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="{% static 'lipa na mpesa.png' %}" alt="Lipa na Mpesa">
  </div>

  <form id="stkForm">
    {% csrf_token %}
    <label for="phone">Phone Number (format: 2547xxxxxxx)</label>
    <input type="text" id="phone" name="phone" required>

    <label for="amount">Amount (KES)</label>
    <input type="number" id="amount" name="amount" min="1" required>

    <input type="submit" value="Pay Now">

    <p style="color: rgb(104, 6, 223); font-size: 0.9em;">
      * This is a <strong>test environment</strong>. All transactions will be auto-reversed.
    </p>
  </form>

  <div id="status"></div>
  <div id="spinner" style="display: none; text-align: center; margin-top: 20px;">
    <img src="{% static 'spinner.svg' %}" alt="Loading..." style="width: 50px;">
  </div>
</div>

<!-- Modal -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle">...</h2>
    <div id="modalMessage">...</div>
  </div>
</div>

<footer>
  -by <a target="_blank" href="https://kemboi.dev">Kemboi</a>
</footer>

<script>
function showStatus(message, type) {
  const status = document.getElementById("status");
  status.innerText = message;
  status.className = type;
  status.style.display = "block";
}

function showSpinner(show) {
  document.getElementById("spinner").style.display = show ? "block" : "none";
}

function showModal(title, html) {
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalMessage").innerHTML = html;
  document.getElementById("paymentModal").style.display = "block";
}

function closeModal() {
  document.getElementById("paymentModal").style.display = "none";
}

document.getElementById("stkForm").addEventListener("submit", function(e){
  e.preventDefault();

  let phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value;

  if (phone.startsWith("07")) {
    phone = "254" + phone.substring(1);
  }

  showStatus("Initiating payment...", "success");
  showSpinner(true);

  fetch("/stk/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({ phone, amount })
  })
  .then(res => res.json())
  .then(data => {
    if (data.CheckoutRequestID) {
      showStatus("Waiting for payment confirmation...", "success");

      setTimeout(() => {
        fetch("/api/latest-payment/")
        .then(res => res.json())
        .then(data => {
          showSpinner(false);
          if (data.result_code === 0) {
            showStatus("✅ Payment Successful!", "success");
            showModal("✅ Payment Successful", `
              <p><strong>Transaction ID:</strong> ${data.transaction_id}</p>
              <p><strong>Amount:</strong> ${data.amount}</p>
              <p><strong>Phone:</strong> ${data.phone}</p>
              <p><strong>Status:</strong> ${data.result_desc}</p>
            `);
          } else {
            showStatus("❌ Payment failed.", "error");
            showModal("❌ Payment Failed", `<p>${data.result_desc || "Something went wrong."}</p>`);
          }
        });
      }, 10000);
    } else {
      showSpinner(false);
      showStatus("❌ Failed to initiate payment.", "error");
      showModal("❌ Error", "<p>Could not initiate STK push.</p>");
    }
  })
  .catch(err => {
    showSpinner(false);
    showStatus("❌ Network error: " + err.message, "error");
    showModal("❌ Network Error", `<p>${err.message}</p>`);
  });
});
</script>
</body>
</html>
