{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPESA STK Push Payment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: auto;
      margin-top: 50px;
      width: 90%;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }

    label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background: #219150;
    }

    #status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      display: none;
    }

    #status.success {
      background: #e0f8e9;
      color: #2c662d;
      border: 1px solid #27ae60;
    }

    #status.error {
      background: #ffe5e5;
      color: #a94442;
      border: 1px solid #e74c3c;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding: 20px 10px;
      background-color: #2c3e50;
      color: white;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 30px;
        padding: 20px;
      }

      .logo img {
        max-width: 150px;
      }

      input[type="submit"] {
        font-size: 16px;
      }
    }
  </style>
  <script>
    function showStatus(message, type) {
      const status = document.getElementById("status");
      status.innerText = message;
      status.className = "";
      status.style.display = "block";
      if (type === "success") {
        status.classList.add("success");
      } else {
        status.classList.add("error");
      }
    }

    function showSpinner(show) {
  const spinner = document.getElementById("spinner");
  spinner.style.display = show ? "block" : "none";
}

function initiatePayment(event) {
  event.preventDefault();
  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;

  showStatus("Initiating payment...", "success");
  showSpinner(true); // Show spinner

  fetch("/stk/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ phone, amount })
  })
  .then(response => response.json())
  .then(data => {
    if (data.CheckoutRequestID) {
      showStatus("Payment initiated. Waiting for confirmation...", "success");

      setTimeout(() => {
        fetch("/results/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ CheckoutRequestID: data.CheckoutRequestID })
        })
        .then(res => res.json())
        .then(query => {
          showSpinner(false); // Hide spinner

          if (query.message && query.message.startsWith("0")) {
            showStatus("✅ Payment Successful!", "success");
          } else if (query.message) {
            showStatus("❌ " + query.message, "error");
          } else {
            showStatus("⚠️ Unknown response received", "error");
          }
        });
      }, 10000);
    } else {
      showSpinner(false); // Hide spinner
      showStatus("❌ " + (data.error || "Failed to initiate payment."), "error");
    }
  })
  .catch(err => {
    showSpinner(false); // Hide spinner
    showStatus("❌ Network error: " + err.message, "error");
  });
}

  </script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="{% static 'lipa na mpesa.png' %}" alt="Lipa na Mpesa">
    </div>
    <form onsubmit="initiatePayment(event)">
      <label for="phone">Phone Number(2547xxxxxxxx)</label>
      <input type="text" id="phone" name="phone" placeholder="e.g. 254712345678" required>
    
      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" name="amount" min="1" required>
    
      <input type="submit" value="Pay Now">
    
      <p style="color: rgb(104, 6, 223); font-size: 0.9em; margin-top: 10px;">
        * This is a <strong>test environment</strong>. All transactions will be <strong>auto-reversed</strong> shortly by mpesa.
      </p>
    </form>
    

    <div id="status"></div>
    <div id="spinner" style="display: none; text-align: center; margin-top: 20px;">
        <img src="{% static 'spinner.svg' %}" alt="Loading..." style="width: 50px;">
      </div>
  </div>

  <footer>
       -by <a target="_blank" href="https://kemboi.dev">Kemboi</a>
  </div>
  </footer>
</body>
</html>
